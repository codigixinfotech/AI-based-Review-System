<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Review QR Automation{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;300;400;700&family=Roboto:wght@100;300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        barlow: ['Barlow', 'sans-serif'],
                        roboto: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <script>
        // Polyfill for crypto.randomUUID in non-secure (HTTP) contexts
        if (!window.crypto.randomUUID) {
            window.crypto.randomUUID = function() {
                return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
                );
            };
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; font-weight: 100; }
        h1, h2, h3, h4, h5, h6 { font-family: 'roboto', sans-serif; font-weight: 300 !important; }
        p, span, div, a, li, input, label { font-family: 'Roboto', sans-serif; font-weight: 300; }
        .btn-primary { @apply bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors ; }
        .card { @apply bg-white p-6 rounded-xl shadow-md border border-gray-100; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-lg p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl ">ReviewQR</h1>
            <div class="space-x-4">
                <a href="/" class="hover:underline">Home</a>
                <a href="/admin/panel" class="hover:underline">Admin</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center p-8 text-gray-500 text-sm">
        &copy; 2024 Review QR Automation
    </footer>
</body>
</html>
